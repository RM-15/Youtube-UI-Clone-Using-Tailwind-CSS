<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Youtube UI Clone</title>
</head>
<body>
<header>
    <nav class="bg-zinc-950 w-full">
         <div class="h-14 p-6 flex items-center justify-between ">
            <div class="flex items-center justify-between gap-5">
                <i class="fa-solid fa-bars text-xl" style="color: rgb(195, 190, 190);"></i>
                <div class="flex items-center justify-between gap-1">
                    <i class="fa-brands fa-youtube text-2xl size-6 bg-white" style="color: rgb(227, 16, 16);"></i>
                    <h1 class="font-bold text-white text-xl size-8">YOUTUBE</h1>
                </div>
            </div>
            <div>
                <div class="w-full border border-solid p-2 rounded-4xl">
                    <input type="text" placeholder="Search" class="text-white border border-white p-l">
                    <i class="fa-solid fa-magnifying-glass" style="color: rgb(195, 190, 190);"></i>
                </div>
            </div>
            <div></div>
         </div>
    </nav>
</header>
</body>
</html>
