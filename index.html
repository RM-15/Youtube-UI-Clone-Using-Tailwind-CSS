<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

                </div>
                <div class=" flex flex-1 justify-center items-center gap-4">
                    <div
                        class="w-150 h-10 border border-solid border-zinc-500 px-5 rounded-4xl flex items-center justify-between">
                        <input type="text" placeholder="Search" class="text-base">

                    <div class=" flex items-center justify-center text-xl rounded-3xl w-10 h-10 bg-[#ededebf9]"><svg

                        </svg></div>
                </div>
                <div class="flex justify-center items-center gap-4">
                    <div class="bg-[#ededebf9] flex items-center justify-center gap-2 font-semibold rounded-3xl h-9 w-25">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
                            <path d="M440-120v-320H120v-80h320v-320h80v320h320v80H520v320h-80Z" />
                        </svg>
                        <h1>Create</h1>
                    </div>
                    <div><svg xmlns="http://www.w3.org/2000/svg" height="27px" viewBox="0 -960 960 960" width="27px">
                            <path
                                d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z" />

                    <div class="rounded-3xl h-9 w-9 bg-orange-200 mx-2">
                        <img src="rehanimg.jpg" alt="" class="object-cover rounded-3xl bg-white">
                    </div>
                </div>
            </div>

</html>
