<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Youtube UI Clone</title>
</head>

<body>
    <header>
        <nav class="w-full max-w-screen-2xl mx-auto max-sm:mx-0">
            <div class="h-14 p-3 flex items-center justify-between">
                <div class="flex items-center gap-5">
                    <i class="fa-solid fa-bars text-xl"></i>
                    <div class="flex items-center justify-between gap-0">
                        <i class="fa-brands fa-youtube text-2xl size-6" style="color: rgb(227, 16, 16);"></i>
                        <h1 class="font-bold text-black text-xl size-8 tracking-tighter">YouTube</h1>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-48 max-sm:gap-2 max-lg:gap-4">
                    <div class=" flex items-center gap-4">
                        <div
                            class="max-sm:border-none max-sm:w-0 max-sm:text-xl max-lg:w-59 max-lg:text-xl w-150 h-10 border border-solid border-zinc-500 px-5 rounded-4xl flex items-center justify-between">
                            <input type="text" placeholder="Search" class="text-base flex items-center max-sm:hidden">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <div class=" flex items-center justify-center text-xl rounded-3xl w-10 h-10 bg-[#ededebf9] max-sm:hidden">
                            <span class="material-symbols-outlined">
                                mic
                            </span></div>
                    </div>
                    <div class="flex justify-center items-center gap-4">
                        <div
                            class="bg-[#ededebf9] flex items-center justify-center gap-2 font-semibold rounded-3xl h-9 w-25">
                            <span class="material-symbols-outlined">
                                add_2
                            </span>
                            <h1>Create</h1>
                        </div>
                        <div class="flex items-center justify-center max-sm:hidden"><span class="material-symbols-outlined">
                                notifications
                            </span></div>
                        <div class="rounded-3xl h-9 w-9 bg-orange-200 mx-2 max-sm:mx-0">
                            <img src="rehanimg.jpg" alt="" class="object-cover rounded-3xl bg-white">
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
